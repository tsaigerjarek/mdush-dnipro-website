name: Перевірити якість сайту

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v7

      - name: Налаштувати Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Перевірити типи, маршрути, якість і production-збірку
        run: npm test
